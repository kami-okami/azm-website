{% extends "base.html" %}
{% block content %}

<!-- Hero -->
<section class="contact-hero hero-bg">
  <div class="contact-hero__inner">
    <h1 class="contact-hero__title">تواصل معنا</h1>
    <p class="contact-hero__sub">نحن هنا للإجابة على استفساراتكم وتقديم عروض الأسعار</p>
  </div>
</section>

<!-- Contact -->
<section class="contact-section">
  <div class="contact-grid">

    <!-- Info cards -->
    <div class="contact-info">
      <div class="contact-card custom-shadow">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div>
          <h3 class="contact-card__title">أرقام الهاتف</h3>
          <p class="contact-card__phones" dir="ltr">
            <a href="tel:+9647802280589">07802280589</a>
            <span class="contact-card__sep">·</span>
            <a href="tel:+9647740818896">07740818896</a>
            <span class="contact-card__sep">·</span>
            <a href="tel:+9647518232611">07518232611</a>
          </p>
        </div>
      </div>

      <div class="contact-card custom-shadow">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        </div>
        <div>
          <h3 class="contact-card__title">البريد الإلكتروني</h3>
          <a class="contact-card__email" href="mailto:info@azmsupply.com" dir="ltr">info@azmsupply.com</a>
        </div>
      </div>

      <div class="contact-card custom-shadow">
        <div class="contact-card__icon contact-card__icon--wa" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div>
          <h3 class="contact-card__title">واتساب</h3>
          <a class="btn-whatsapp contact-wa-btn" target="_blank" rel="noopener"
             href="https://wa.me/{{ whatsapp_number }}?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D8%AE%D8%AF%D9%85%D8%A7%D8%AA%D9%83%D9%85">ابدأ محادثة</a>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="contact-form-wrap custom-shadow">
      <h2 class="contact-form__title">أرسل رسالتك</h2>

      <!-- PROTECTED FORM — attributes/field names/CSRF/reCAPTCHA/phone validation unchanged. Only visual wrapper classes are new. -->
      <form class="contact-form" method="post" action="{{ url_for('contact') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">

        <div class="contact-form__row">
          <div class="contact-field">
            <label class="contact-label" for="name">الاسم الكامل *</label>
            <input class="contact-input" id="name" type="text" name="name" placeholder="الاسم الكامل *" required>
          </div>
          <div class="contact-field">
            <label class="contact-label" for="phone">رقم الهاتف *</label>
            <input
              class="contact-input"
              id="phone"
              type="tel"
              name="phone"
              inputmode="numeric"
              autocomplete="tel-national"
              dir="ltr"
              required
              pattern="^(?:0?7[5789]\d{8}|(?:\+?964)?7[5789]\d{8})$"
              title="أدخل رقم هاتف عراقي صحيح يبدأ بـ 075 أو 077 أو 078 أو 079 (مثال: 07802280589 أو +9647802280589)."
              placeholder="ادخل رقم هاتف صحيح" />
          </div>
        </div>

        <div class="contact-form__row">
          <div class="contact-field">
            <label class="contact-label" for="email">البريد الإلكتروني (اختياري)</label>
            <input class="contact-input" id="email" type="email" name="email" dir="ltr" placeholder="البريد الإلكتروني (اختياري)">
          </div>
          <div class="contact-field">
            <label class="contact-label" for="subject">الموضوع (اختياري)</label>
            <input class="contact-input" id="subject" type="text" name="subject" placeholder="الموضوع (اختياري)">
          </div>
        </div>

        <div class="contact-field">
          <label class="contact-label" for="message">الرسالة *</label>
          <textarea class="contact-input contact-textarea" id="message" name="message" rows="5" placeholder="نص الرسالة *" required></textarea>
        </div>

        <!-- reCAPTCHA — DO NOT MODIFY -->
        <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>

        <button class="btn-primary contact-submit" type="submit">إرسال الرسالة</button>
      </form>
    </div>

  </div>
</section>
{% endblock %}

{% block extra_scripts %}
  <!-- Load reCAPTCHA once -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <!-- Optional UX guard for deny-listed numbers (server still enforces) -->
  <script>
  (function () {
    const deny = new Set(["07802280589","07740818896","07518232611"]);
    const input = document.querySelector('input[name="phone"]');

    function stripFormatting(raw) {
      if (!raw) return "";
      // Preserve a leading +, strip everything else non-digit
      const hasPlus = raw.trim().startsWith("+");
      const digits = raw.replace(/\D/g, "");
      return (hasPlus ? "+" : "") + digits;
    }

    function normalize(raw) {
      if (!raw) return "";
      let d = raw.replace(/\D/g, "");
      if (d.startsWith("00964")) d = d.slice(5);
      else if (d.startsWith("964")) d = d.slice(3);
      if (d.startsWith("0")) d = d.slice(1);
      if (d.length === 10 && d.startsWith("7")) return "0" + d;
      return raw;
    }

    function check() {
      if (!input) return;
      // Strip spaces/dashes/parens from the input value in place
      const cleaned = stripFormatting(input.value);
      if (cleaned !== input.value) {
        input.value = cleaned;
      }
      const n = normalize(input.value);
      if (deny.has(n)) {
        input.setCustomValidity("يرجى إدخال رقم هاتف مختلف.");
      } else {
        input.setCustomValidity("");
      }
    }

    if (input) {
      input.addEventListener("input", check);
      input.addEventListener("change", check);
      input.addEventListener("blur", check);
    }

    // Prevent double submit
    const form = document.querySelector('form[action="{{ url_for("contact") }}"]');
    if (form) {
      form.addEventListener('submit', function () {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
      });
    }
  })();
  </script>
{% endblock %}
